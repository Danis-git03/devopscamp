<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANIS | Wintel Support</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f14;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .profile-card {
            width: 360px;
            padding: 40px 32px;
            text-align: center;
            background: #151b23;
            border: 1px solid #252e3a;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #222b36;
            border: 2px solid #3a4654;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 30px;
            letter-spacing: 3px;
        }

        .role {
            margin-bottom: 28px;
            color: #aeb8c5;
            font-size: 16px;
        }

        .section {
            padding: 18px 0;
            border-top: 1px solid #252e3a;
        }

        .label {
            margin-bottom: 8px;
            color: #7f8b99;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .value {
            color: #e8edf2;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <main class="profile-card">
        <div class="avatar">D</div>

        <h1>DANIS</h1>
        <p class="role">Wintel Support - tambah satu baris</p>
	

        <div class="section">
            <div class="label">Kemahiran</div>
            <div class="value">Wintel</div>
        </div>

        <div class="section">
            <div class="label">Fakta Menarik</div>
            <div class="value">Tiada</div>
        </div>
    </main>

</body>
</html>
